<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sitio en Construcción</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: url('2474082.jpg') no-repeat center center;
      background-size: cover;            /* Escala la imagen para cubrir toda la pantalla */
      background-position: center center;/* Centra la imagen horizontal y verticalmente */
      background-repeat: no-repeat;      /* Evita que se repita la imagen */
      background-attachment: fixed;      /* (Opcional) hace que el fondo no se mueva al hacer scroll */
    }
  </style>
</head>
<body>
</body>
</html>
